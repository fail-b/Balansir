<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"></helmet>
<div style="position:absolute;inset:0;pointer-events:none;z-index:50;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:var(--ink)">
  <div style="position:absolute;top:11px;left:50%;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000"></div>
  <div style="position:absolute;top:17px;left:0;width:150px;text-align:center;font-size:17px;font-weight:600;letter-spacing:-0.3px">9:41</div>
  <div style="position:absolute;top:19px;right:30px;display:flex;align-items:center;gap:6px;font-size:17px">
    <i class="ph-fill ph-cell-signal-full"></i><i class="ph-bold ph-wifi-high"></i><i class="ph-fill ph-battery-full" style="font-size:24px"></i>
  </div>
  <sc-if value="{{ full }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:20px;right:20px;bottom:26px;display:flex;gap:10px;pointer-events:auto">
      <div style="flex:1;height:62px;border-radius:31px;padding:4px;box-sizing:border-box;display:flex;background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:0.5px solid var(--glass-b);box-shadow:var(--glass-sh)">
        <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
          <div style="flex:1;border-radius:27px;background:{{ t.bg }};color:{{ t.color }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
            <i class="{{ t.iconClass }}" style="font-size:23px"></i>
            <span style="font-size:10px;font-weight:600;letter-spacing:-0.1px">{{ t.label }}</span>
          </div>
        </sc-for>
      </div>
      <div style="width:62px;height:62px;border-radius:50%;flex:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(0,0,0,.08)"><i class="ph-bold ph-plus" style="font-size:26px"></i></div>
    </div>
  </sc-if>
  <sc-if value="{{ mini }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:20px;right:20px;bottom:26px;display:flex;gap:10px;pointer-events:auto">
      <div style="width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--accent);background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:0.5px solid var(--glass-b);box-shadow:var(--glass-sh)"><i class="{{ activeIcon }}" style="font-size:23px"></i></div>
      <div style="flex:1;height:52px;border-radius:26px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-sizing:border-box;background:var(--glass);backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);border:0.5px solid var(--glass-b);box-shadow:var(--glass-sh)">
        <span style="font-size:14px;color:var(--ink2)">{{ accLabel }}</span>
        <span style="font-size:15px;font-weight:600;font-variant-numeric:tabular-nums">{{ accValue }}</span>
      </div>
      <div style="width:52px;height:52px;border-radius:50%;flex:none;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px var(--accent-soft),inset 0 1px 0 rgba(255,255,255,.35)"><i class="ph-bold ph-plus" style="font-size:24px"></i></div>
    </div>
  </sc-if>
  <div style="position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--ink)"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;tab&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:3,&quot;tsType&quot;:&quot;number&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;full&quot;,&quot;mini&quot;,&quot;none&quot;],&quot;default&quot;:&quot;full&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Сегодня&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accValue&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;−3 320 ₽&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.tab ?? 0;
    const mode = this.props.mode || 'full';
    const defs = [['house', 'Главная'], ['list-bullets', 'Операции'], ['chart-pie-slice', 'Статистика'], ['credit-card', 'Счета']];
    const tabs = defs.map(([i, l], k) => ({
      label: l,
      iconClass: (k === a ? 'ph-fill ph-' : 'ph ph-') + i,
      color: k === a ? 'var(--accent)' : 'var(--ink)',
      bg: k === a ? 'var(--sel)' : 'transparent'
    }));
    return {
      tabs, full: mode === 'full', mini: mode === 'mini',
      activeIcon: 'ph-fill ph-' + defs[a][0],
      accLabel: this.props.accLabel || 'Сегодня',
      accValue: this.props.accValue || '−3 320 ₽'
    };
  }
}
</script>
</body>
</html>
