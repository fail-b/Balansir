<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"><link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css"></helmet>
<div style="display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative;min-height:44px;font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;color:var(--ink)">
  <div style="position:relative;width:40px;height:40px;border-radius:50%;background:{{ iconBg }};display:flex;align-items:center;justify-content:center;flex:none">
    <i class="{{ iconClass }}" style="font-size:20px;color:{{ iconColor }}"></i>
    <sc-if value="{{ showDot }}" hint-placeholder-val="{{ true }}"><span style="position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;background:{{ dotColor }};border:2px solid var(--card);box-sizing:border-box"></span></sc-if>
  </div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
    <div style="font-size:16px;font-weight:500;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</div>
    <div style="font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ sub }}</div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none">
    <div style="font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;color:{{ amountColor }}">{{ amount }}</div>
    <div style="font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums">{{ time }}</div>
  </div>
  <sc-if value="{{ sep }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;left:68px;right:0;bottom:0;height:0.5px;background:var(--sep)"></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:64},&quot;entry&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;iconStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dot&quot;,&quot;mono&quot;,&quot;color&quot;],&quot;default&quot;:&quot;dot&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sep&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const e = this.props.entry || {};
    const s = this.props.iconStyle || 'dot';
    const c = s === 'color';
    return {
      title: e.title, sub: e.sub, amount: e.amount, time: e.time,
      iconBg: c ? e.color + '26' : 'var(--fill)',
      iconColor: c ? e.color : 'var(--ink)',
      iconClass: (c ? 'ph-fill ph-' : 'ph ph-') + (e.icon || 'circle'),
      showDot: s === 'dot', dotColor: e.color,
      amountColor: e.income ? 'var(--income)' : 'var(--ink)',
      sep: !!this.props.sep
    };
  }
}
</script>
</body>
</html>
